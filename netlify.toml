[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Firebase web config সাধারণ (public) তথ্য; Netlify-র secrets-scan যেন বিল্ড না আটকায়
  SECRETS_SCAN_OMIT_KEYS = "VITE_CENTRAL_FIREBASE_API_KEY,VITE_CENTRAL_FIREBASE_AUTH_DOMAIN,VITE_CENTRAL_FIREBASE_PROJECT_ID,VITE_CENTRAL_FIREBASE_STORAGE_BUCKET,VITE_CENTRAL_FIREBASE_MESSAGING_SENDER_ID,VITE_CENTRAL_FIREBASE_APP_ID,VITE_RESULTS_FIREBASE_API_KEY,VITE_RESULTS_FIREBASE_AUTH_DOMAIN,VITE_RESULTS_FIREBASE_PROJECT_ID,VITE_RESULTS_FIREBASE_STORAGE_BUCKET,VITE_RESULTS_FIREBASE_MESSAGING_SENDER_ID,VITE_RESULTS_FIREBASE_APP_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
